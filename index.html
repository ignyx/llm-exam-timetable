<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Timetabling</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <h1>Exam Timetable App</h1>
      <p id="status" data-testid="status">Loading...</p>
      <button data-testid="execute-button" onclick="runMinizincAndDisplay()">
        Execute MiniZinc Model
      </button>
      <div id="results"></div>
      <input type="file" id="fileInput" accept=".xlsx" />
      <a id="mailtoLink" href="#" target="_blank">Email link will appear here</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/minizinc/dist/minizinc.js"></script>
    <script src="src/minizincRunner.js"></script>
    <script src="src/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="src/dispo_TI.js"></script>
  </body>
</html>
